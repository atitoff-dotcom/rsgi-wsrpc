[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsgi-wsrpc"
version = "0.2.0"
description = "High-performance reactive fullstack Python framework on Rust RSGI (Granian) with symmetric WSRPC (JSON-RPC 2.0) and Tabular Data Compression."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alex Titoff", email = "a.tit.off@gmail.com" }
]
keywords = ["rsgi", "granian", "wsrpc", "json-rpc", "websocket", "reactive", "fastapi-alternative", "django-alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "granian>=1.6.0",
    "orjson>=3.9.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0.0",
]
sqlite = [
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
]
postgres = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
]
mysql = [
    "sqlalchemy>=2.0.0",
    "asyncmy>=0.2.9",
]
full = [
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "asyncmy>=0.2.9",
]

[project.urls]
Homepage = "https://github.com/atitoff-dotcom/rsgi-wsrpc"
Documentation = "https://github.com/atitoff-dotcom/rsgi-wsrpc/blob/main/docs/readme.md"
Repository = "https://github.com/atitoff-dotcom/rsgi-wsrpc.git"

[tool.setuptools.packages.find]
include = ["rsgi_wsrpc*"]

